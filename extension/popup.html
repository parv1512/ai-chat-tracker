<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: -apple-system, sans-serif; width: 220px; padding: 12px; }
  label { font-size: 12px; color: #555; }
  input { width: 100%; padding: 6px; margin: 6px 0 10px; box-sizing: border-box; font-size: 13px; }
  button { width: 100%; padding: 7px; cursor: pointer; }
  #status { font-size: 11px; color: #4a4a4a; margin-top: 8px; min-height: 14px; }
</style>
</head>
<body>
  <label for="label">Profile label</label>
  <input id="label" placeholder="e.g. Work, Personal, Client A">
  <button id="save">Save</button>
  <div id="status"></div>
  <div id="idRow" style="font-size:10.5px;color:#999;margin-top:10px;"></div>
  <script src="popup.js"></script>
</body>
</html>
